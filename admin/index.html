<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in — Apovix Admin</title>
  <meta name="theme-color" content="#FFFFFF" />

  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>

  <main class="login">
    <div class="login-card">

      <div class="login-card__brand">
        <img src="../assets/img/logo-mark.png" alt="" />
        <span>APOVIX</span>
      </div>

      <h1>Admin sign in</h1>
      <p class="login-card__lede">Control panel for apovix-website.</p>

      <div class="notice notice--error" id="error" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="submit" style="margin-top:1.25rem">
          Sign in
        </button>
      </form>

      <p class="login-card__foot">
        Accounts are created in the Firebase console, then granted access from
        the Users page. There is no self sign-up.
      </p>

    </div>
  </main>

  <script type="module">
    import { auth, db } from './assets/js/firebase-init.js';
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const form   = document.getElementById('login-form');
    const errBox = document.getElementById('error');
    const submit = document.getElementById('submit');

    function fail(message) {
      errBox.textContent = message;
      errBox.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }

    // Already signed in and already an admin? Skip the form.
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      try {
        const snap = await getDoc(doc(db, 'admins', user.uid));
        if (snap.exists()) window.location.replace('dashboard.html');
      } catch (_) {
        // Not authorised, or Firestore unreachable — leave the form up.
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true;
      submit.disabled = true;
      submit.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return fail('Enter your email and password.');

      let cred;
      try {
        cred = await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        const map = {
          'auth/invalid-credential': 'That email and password do not match an account.',
          'auth/invalid-email':      'That is not a valid email address.',
          'auth/user-disabled':      'This account has been disabled.',
          'auth/too-many-requests':  'Too many attempts. Wait a few minutes and try again.',
          'auth/network-request-failed': 'No connection to Firebase. Check your internet.',
          'auth/operation-not-allowed':
            'Email/password sign-in is not enabled for this project yet. ' +
            'Turn it on in Firebase console -> Authentication -> Sign-in method.'
        };
        return fail(map[err.code] || (err.code + ' — ' + err.message));
      }

      // Signing in is not the same as being allowed in.
      try {
        const snap = await getDoc(doc(db, 'admins', cred.user.uid));
        if (!snap.exists()) {
          await signOut(auth);
          return fail(
            'This account is not on the admin list. Its user ID is ' +
            cred.user.uid + ' — an owner must add it on the Users page.'
          );
        }
      } catch (err) {
        await signOut(auth);
        return fail(
          err.code === 'permission-denied'
            ? 'This account is not authorised for the admin panel.'
            : 'Could not reach Firestore: ' + err.message
        );
      }

      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
