          <li><a href="index.html#process">Process</a></li>
          <li><a href="about.html">About</a></li>

        </ul>
      </nav>
      <a class="btn btn--primary site-header__cta" href="index.html#contact">Start a project</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" data-menu-open>
        <span class="menu-toggle__bars" aria-hidden="true"><span></span><span></span></span>

  <div class="mobile-menu" id="mobile-menu" data-menu hidden>
    <div class="mobile-menu__bar container">
      <a class="logo" href="index.html" data-menu-link aria-label="Apovix Technologies — home">
        <img class="logo__mark" src="assets/img/logo-mark.png" alt="" width="512" height="497" />
        <span class="logo__word">APOVIX</span>
      </a>
      <button class="menu-toggle" type="button" data-menu-close>
        <span class="menu-toggle__x" aria-hidden="true"></span>
        <span class="sr-only">Close menu</span>

      <ul>

    </nav>

  <main id="main">
    <section class="section">
      <div class="container auth-wrap">
        <div class="auth-card">

          <p class="eyebrow">Sign in</p>
          <h1 class="auth-card__title">Welcome back.</h1>
          <p class="auth-card__lede">Sign in to see and update your details.</p>

          <div class="notice notice--error" id="error" hidden></div>
          <div class="notice notice--ok" id="ok" hidden></div>

          <button class="btn btn--ghost btn--block google-btn" type="button" id="google">
            <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false" width="18" height="18">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33Z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
            </svg>
            Continue with Google
          </button>

          <div class="or"><span>or</span></div>

          <form class="form form--plain" id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" />
            </div>
            <button class="btn btn--primary btn--block" type="submit" id="submit">Sign in</button>
            <button class="linkish" type="button" id="reset" style="margin-top:1rem">
              Forgot your password?
            </button>
          </form>

          <p class="auth-card__foot">
            No account yet? <a href="register.html">Create one</a>.
          </p>

        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js" defer></script>

  <script type="module">
    import { auth, db } from './assets/js/fb.js';
    import {
      signInWithEmailAndPassword, signInWithPopup, signInWithRedirect,
      getRedirectResult, GoogleAuthProvider, onAuthStateChanged, sendPasswordResetEmail
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { doc, getDoc }
      from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';


    const $ = (id) => document.getElementById(id);
    const errBox = $('error');
    const okBox = $('ok');
    const submit = $('submit');

    function fail(message) {
      errBox.textContent = message;
      errBox.hidden = false;
      okBox.hidden = true;
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }

    const AUTH_ERRORS = {
      'auth/invalid-credential':     'That email and password do not match an account.',
      'auth/invalid-email':          'That is not a valid email address.',
      'auth/user-disabled':          'This account has been disabled. Please contact us.',
      'auth/too-many-requests':      'Too many attempts. Wait a few minutes and try again.',
      'auth/network-request-failed': 'No connection. Check your internet and try again.',
      'auth/popup-closed-by-user':   'The Google window closed before sign-in finished.',
      'auth/unauthorized-domain':    'This domain is not authorised for sign-in yet.',
      'auth/operation-not-allowed':
        'Email and password sign-in is not switched on for this site yet. ' +
        'Please use "Continue with Google" above.'
    };

    // Signed in but never completed the profile? Send them to finish it.
    async function route(user) {
      const snap = await getDoc(doc(db, 'users', user.uid));
      window.location.replace(snap.exists() ? 'account.html' : 'register.html');
    }

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    $('google').addEventListener('click', async () => {
      errBox.hidden = true;
      try {
        const cred = await signInWithPopup(auth, provider);
        await route(cred.user);
      } catch (err) {
        if (err.code === 'auth/popup-blocked' ||
            err.code === 'auth/operation-not-supported-in-this-environment') {
          try { return await signInWithRedirect(auth, provider); }
          catch (e2) { return fail(AUTH_ERRORS[e2.code] || e2.message); }
        }
        fail(AUTH_ERRORS[err.code] || (err.code + ' — ' + err.message));
      }
    });

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.hidden = true; okBox.hidden = true;

      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return fail('Enter your email and password, or use Google above.');

      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await route(cred.user);
      } catch (err) {
        fail(AUTH_ERRORS[err.code] || (err.code + ' — ' + err.message));
      }
    });

    $('reset').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) return fail('Enter your email address above first, then press this again.');
      try {
        await sendPasswordResetEmail(auth, email);
        errBox.hidden = true;
        okBox.textContent = 'If an account exists for ' + email + ', a reset link is on its way.';
        okBox.hidden = false;
      } catch (err) {
        fail(AUTH_ERRORS[err.code] || err.message);
      }
    });

    try {
      const result = await getRedirectResult(auth);
      if (result && result.user) await route(result.user);
    } catch (err) {
      fail(AUTH_ERRORS[err.code] || err.message);
    }

    onAuthStateChanged(auth, async (user) => { if (user) await route(user); });
  </script>
  <script type="module" src="assets/js/user-nav.js"></script>
</body>
</html>
